name: mobility_CI
on: # 워크플로우를 언제 실행할 것인가
  pull_request:
      branches: ["main", "dev"]
      paths-ignore:
        - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest # 실행환경 지정

    # 실행 스텝 지정
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 시작
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 권한 부여
        run: chmod +x ./gradlew

      - name: 컴파일 체크
        run: ./gradlew clean compileJava compileTestJava --stacktrace

      - name: 단위 테스트 실행 (통합 테스트 제외)
        run: ./gradlew test --tests "*ServiceTest" --tests "*ControllerTest" --stacktrace

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
