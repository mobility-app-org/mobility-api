global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mobility-api-monitor'

scrape_configs:
  # Mobility API 메트릭 수집
  - job_name: 'mobility-api'
    metrics_path: '/mobility/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api-server:8080']
        labels:
          application: 'mobility-api'
          environment: 'docker'

  # Prometheus 자체 메트릭 수집
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
