input {
  # Logback에서 TCP로 전송되는 JSON 로그 수신
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 타임스탬프 파싱
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # 로그 레벨별 태그 추가
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  } else if [level] == "WARN" {
    mutate {
      add_tag => [ "warning" ]
    }
  } else if [level] == "INFO" {
    mutate {
      add_tag => [ "info" ]
    }
  } else if [level] == "DEBUG" {
    mutate {
      add_tag => [ "debug" ]
    }
  }

  # 애플리케이션별 태그 추가
  if [app] == "mobility-api" {
    mutate {
      add_tag => [ "mobility-api" ]
    }
  }

  # Exception 정보가 있으면 별도 필드로 추출
  if [stack_trace] {
    mutate {
      add_field => { "has_exception" => "true" }
    }
  }
}

output {
  # Elasticsearch로 전송
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "mobility-api-logs-%{+YYYY.MM.dd}"
  }

  # 디버깅용 콘솔 출력 (필요시 주석 해제)
  # stdout { codec => rubydebug }
}
